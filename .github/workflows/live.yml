# Live data for the Tonight page: NWS forecast, nightlife headlines, new liquor licenses.
# main only accepts changes through pull requests, so this job keeps its data on its own branch,
# `live-data` (data/live/*.json and nothing else). js/live.js reads it from
# raw.githubusercontent.com and falls back to the copy in main's /data/live/ if that fails.
# No page is ever rebuilt or committed by this job.
# Problems open (or comment on) a GitHub issue titled "Live data job failed"; a good run closes it.
name: Live data

on:
  schedule:
    - cron: "17 3,14,19,23 * * *"   # about 11pm, 10am, 3pm and 7pm New York time (an hour earlier in winter)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/live.yml", "_build/live.py"]

permissions: {}

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # push the live-data branch
      issues: write     # report problems
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Get the last good data from the live-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code "$remote" refs/heads/live-data >/dev/null; then
            git fetch -q --depth 1 "$remote" live-data
            git worktree add -q -f "$RUNNER_TEMP/ld" FETCH_HEAD
            cp "$RUNNER_TEMP"/ld/data/live/*.json data/live/ 2>/dev/null || true
          else
            git worktree add -q --detach "$RUNNER_TEMP/ld"
            git -C "$RUNNER_TEMP/ld" checkout -q --orphan live-data
            git -C "$RUNNER_TEMP/ld" rm -rq --cached . && find "$RUNNER_TEMP/ld" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi

      - name: Fetch live data
        run: python3 _build/live.py

      - name: Publish to the live-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cd "$RUNNER_TEMP/ld"
          mkdir -p data/live && cp "$GITHUB_WORKSPACE"/data/live/*.json data/live/
          git config user.name "nynightlife live data"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live/
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -q -m "live data: forecast, headlines, licenses"
          git push -q "$remote" HEAD:refs/heads/live-data

      - name: Report a source that keeps failing
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          stuck=$(python3 -c "import json;print(' '.join(json.load(open('data/live/status.json')).get('stuck', [])))")
          n=$(gh issue list --state open --search "Live data job failed in:title" --json number --jq '.[0].number' || true)
          if [ -z "$stuck" ]; then
            [ -n "$n" ] && gh issue close "$n" --comment "Working again: $RUN_URL" || true
            exit 0
          fi
          msg="These sources have failed 4+ runs in a row (the site keeps their last good data): $stuck. $RUN_URL"
          if [ -n "$n" ]; then gh issue comment "$n" --body "$msg" || true
          else gh issue create --title "Live data job failed" --body "$msg" || true; fi

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          n=$(gh issue list --state open --search "Live data job failed in:title" --json number --jq '.[0].number' || true)
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Failed again: $RUN_URL" || true
          else
            gh issue create --title "Live data job failed" --body "The scheduled live-data job failed: $RUN_URL. The site keeps showing the last good data; the forecast hides itself once it is too old." || true
          fi
