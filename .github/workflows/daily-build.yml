# Rebuild the site with fresh NYC event listings and publish that build.
# GitHub Pages source has to be "GitHub Actions" for the deploy job to go live.
# Until then, main still contains the generated HTML from the last pull request.
# This job does not commit. Ticketmaster and Viator run only when their secrets exist.
# Nyla's voice: _build/nyla_audio.py renders every sentence she can say as
# /audio/nyla/<sha1>.mp3 (Kokoro af_heart). main carries the files from the last
# pull request; this job renders only new sentences (new events, new counts),
# prunes ones no answer uses any more, and keeps the set in the Actions cache
# between runs. The Pages artifact below ships whatever is in audio/nyla.
#
# The visible New York night on / and /tonight/ is computed in the browser
# from data/events.json (js/tonight.js). The baked HTML is only the no-JS
# fallback for the night of the build. GitHub's cron is often late or skipped
# (on 2026-11-18 the 09:17 and 14:41 UTC runs never started; the last build
# was 04:18Z, which is 23:18 in New York). More crons would not keep the date
# current. These two schedules, plus a run after each successful Live data
# job, only refresh the week snapshot. Overlapping production runs queue on
# one group and each run rewrites the events snapshot in place.
name: Daily build

on:
  schedule:
    - cron: "17 9 * * *"
    - cron: "41 14 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Live data"]
    types: [completed]
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages-live' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Pillow for stored event images
        run: python -m pip install --disable-pip-version-check pillow

      - name: Fetch events
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
          VIATOR_API_KEY: ${{ secrets.VIATOR_API_KEY }}
        run: python _build/events.py

      - name: Build the site
        run: python _build/build.py

      # Nyla's voice. The model (pinned by sha256 in nyla_audio.py) and the rendered
      # MP3s are cached; a run normally renders only a few dozen new sentences.
      # --budget stops rendering after 10 minutes; anything left is answered in text
      # only and rendered on the next run.
      - name: Cache Nyla's voice model
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: ~/.cache/nyla-kokoro
          key: nyla-kokoro-v1.0-int8

      - name: Cache Nyla's rendered audio
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: audio/nyla
          key: nyla-audio-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nyla-audio-v1-

      - name: Install Nyla's voice
        run: python -m pip install --disable-pip-version-check -r _build/requirements-audio.txt

      - name: Render Nyla's voice
        run: python _build/nyla_audio.py --budget 600

      # Hard tests block the deploy: input safety, affiliate markup, the event
      # fetcher, well-formed HTML, JSON-LD, and links. Intent phrases are a
      # separate step. They read the chatbot's answers, which can miss on a
      # slow runner or on copy that changes with the events feed or the day.
      # A miss there warns and still ships an otherwise good build.
      - name: Tests
        run: |
          python _build/test_live.py
          python _build/test_affiliates.py
          python _build/test_events.py
          node _build/test_tonight.js
          python _build/test_html.py
          python _build/test_nyla_data.py
          python _build/test_nyla_audio.py
          node _build/test_nyla.js . --links
          node _build/test_nyla_voice.js .

      - name: Intent checks
        continue-on-error: true
        run: node _build/test_nyla.js . --intents

      - name: Stage the Pages artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --delete \
            --exclude '.git' --exclude '.github' --exclude '_build' \
            --exclude '.gitignore' \
            ./ "$RUNNER_TEMP/site/"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: ${{ runner.temp }}/site

  deploy:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
